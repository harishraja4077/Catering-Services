<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Page not found - Stackly Catering.">
  <title>404 - Page Not Found | Stackly Catering</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- ===== Auth Nav ===== -->
  <nav class="auth-nav">
    <div class="auth-nav-inner">
      <a href="index.html" class="nav-brand">
        <img src="Assets/logo.webp" alt="Stackly" class="nav-brand-logo">
      </a>
      <a href="index.html" class="btn btn-outline" style="border-color: var(--primary); color: var(--primary); padding: 0.6rem 1.8rem; font-size: 0.8rem;">Back to Home</a>
    </div>
  </nav>

  <!-- ===== 404 Section ===== -->
  <section class="error-404-page">
    <div class="error-404-wrapper">
      <div class="error-code">
        <span class="error-zero" style="display:inline-block; animation: floatZero 3s ease-in-out infinite;">4</span>
        <span class="error-zero" style="display:inline-block; animation: floatZero 3s ease-in-out 0.4s infinite;">0</span>
        <span class="error-zero" style="display:inline-block; animation: floatZero 3s ease-in-out 0.8s infinite;">4</span>
      </div>
      <h1>Oops! Page Not Found</h1>
      <p>The page you're looking for has been served to another table. Let us help you find your way back to something delicious.</p>
      <div class="error-buttons">
        <a href="index.html" class="btn"><i class="fas fa-home" style="margin-right: 0.5rem;"></i> Back to Home</a>
        <a href="javascript:history.back()" class="btn btn-outline" style="border-color: var(--primary); color: var(--primary);"><i class="fas fa-arrow-left" style="margin-right: 0.5rem;"></i> Go Back</a>
      </div>
    </div>
  </section>

  <script src="js/script.js"></script>
</body>
</html>

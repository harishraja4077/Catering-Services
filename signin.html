<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Sign in to your Stackly Catering account.">
  <title>Sign In | Stackly Catering</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- ===== Auth Nav ===== -->
  <nav class="auth-nav">
    <div class="auth-nav-inner">
      <a href="index.html" class="nav-brand">
        <img src="Assets/logo.webp" alt="Stackly" class="nav-brand-logo">
      </a>
      <a href="index.html" class="btn btn-outline" style="border-color: var(--primary); color: var(--primary); padding: 0.6rem 1.8rem; font-size: 0.8rem;">Back to Home</a>
    </div>
  </nav>

  <!-- ===== Sign In Section ===== -->
  <section class="auth-page">
    <div class="auth-container">
      <div class="auth-card">
        <div class="auth-card-header">
          <div class="auth-logo-icon"><i class="fas fa-user-lock"></i></div>
          <h2>Welcome Back</h2>
          <p>Sign in to continue to your Stackly account</p>
        </div>
        <div class="auth-card-body">
          <div class="auth-error-msg" id="signinError"></div>
          <form class="auth-form" id="signinForm">
            <div class="form-group" style="margin-bottom: 1rem;">
              <label>Sign In As<span>*</span></label>
            </div>
            <div class="auth-role-selector">
              <label class="auth-role-option">
                <input type="radio" name="signinRole" value="user" checked>
                <div class="auth-role-card">
                  <div class="role-icon"><i class="fas fa-user"></i></div>
                  <div>
                    <div class="role-label">User</div>
                    <div class="role-desc">Client & bookings</div>
                  </div>
                </div>
              </label>
              <label class="auth-role-option">
                <input type="radio" name="signinRole" value="admin">
                <div class="auth-role-card">
                  <div class="role-icon"><i class="fas fa-user-shield"></i></div>
                  <div>
                    <div class="role-label">Admin</div>
                    <div class="role-desc">Manage & dashboard</div>
                  </div>
                </div>
              </label>
            </div>
            <div class="form-group">
              <label for="signinEmail">Email Address<span>*</span></label>
              <i class="fas fa-envelope auth-input-icon"></i>
              <input type="email" id="signinEmail" class="form-control" placeholder="you@example.com" autocomplete="email">
            </div>
            <div class="form-group">
              <label for="signinPassword">Password<span>*</span></label>
              <i class="fas fa-lock auth-input-icon"></i>
              <input type="password" id="signinPassword" class="form-control" placeholder="Enter your password" autocomplete="current-password">
              <button type="button" class="auth-password-toggle" data-target="signinPassword" aria-label="Toggle password visibility">
                <i class="fas fa-eye"></i>
              </button>
            </div>
            <div class="auth-row">
              <label class="auth-checkbox">
                <input type="checkbox" id="rememberMe">
                Remember me
              </label>
              <a href="404.html" class="auth-link">Forgot Password?</a>
            </div>
            <button type="submit" class="btn auth-btn">
              <i class="fas fa-sign-in-alt"></i> Sign In
            </button>
          </form>
          <div class="auth-divider">or continue with</div>
          <div class="social-auth-buttons">
            <button type="button" class="social-auth-btn" onclick="window.location.href='404.html'">
              <i class="fab fa-google"></i> Google
            </button>
            <button type="button" class="social-auth-btn" onclick="window.location.href='404.html'">
              <i class="fab fa-facebook-f"></i> Facebook
            </button>
          </div>
        </div>
        <div class="auth-card-footer">
          Don't have an account? <a href="signup.html">Create one free</a>
        </div>
      </div>
    </div>
  </section>

  <script src="js/script.js"></script>
</body>
</html>

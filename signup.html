<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Create a new account with Stackly Catering.">
  <title>Sign Up | Stackly Catering</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- ===== Auth Nav ===== -->
  <nav class="auth-nav">
    <div class="auth-nav-inner">
      <a href="index.html" class="nav-brand">
        <img src="Assets/logo.webp" alt="Stackly" class="nav-brand-logo">
      </a>
      <a href="index.html" class="btn btn-outline" style="border-color: var(--primary); color: var(--primary); padding: 0.6rem 1.8rem; font-size: 0.8rem;">Back to Home</a>
    </div>
  </nav>

  <!-- ===== Sign Up Section ===== -->
  <section class="auth-page">
    <div class="auth-container">
      <div class="auth-card">
        <div class="auth-card-header">
          <div class="auth-logo-icon"><i class="fas fa-user-plus"></i></div>
          <h2>Create Account</h2>
          <p>Join Stackly Catering and start planning your event</p>
        </div>
        <div class="auth-card-body">
          <div class="auth-error-msg" id="signupError"></div>
          <div class="auth-success-msg" id="signupSuccess"></div>
          <form class="auth-form" id="signupForm">
            <div class="form-group" style="margin-bottom: 1rem;">
              <label>Register As<span>*</span></label>
            </div>
            <div class="auth-role-selector">
              <label class="auth-role-option">
                <input type="radio" name="signupRole" value="user" checked>
                <div class="auth-role-card">
                  <div class="role-icon"><i class="fas fa-user"></i></div>
                  <div>
                    <div class="role-label">User</div>
                    <div class="role-desc">Client & bookings</div>
                  </div>
                </div>
              </label>
              <label class="auth-role-option">
                <input type="radio" name="signupRole" value="admin">
                <div class="auth-role-card">
                  <div class="role-icon"><i class="fas fa-user-shield"></i></div>
                  <div>
                    <div class="role-label">Admin</div>
                    <div class="role-desc">Manage & dashboard</div>
                  </div>
                </div>
              </label>
            </div>
            <div class="form-row">
              <div class="form-group">
                <label for="signupFirst">First Name<span>*</span></label>
                <i class="fas fa-user auth-input-icon"></i>
                <input type="text" id="signupFirst" class="form-control" placeholder="John" required>
              </div>
              <div class="form-group">
                <label for="signupLast">Last Name<span>*</span></label>
                <i class="fas fa-user auth-input-icon"></i>
                <input type="text" id="signupLast" class="form-control" placeholder="Smith" required>
              </div>
            </div>
            <div class="form-group">
              <label for="signupEmail">Email Address<span>*</span></label>
              <i class="fas fa-envelope auth-input-icon"></i>
              <input type="email" id="signupEmail" class="form-control" placeholder="you@example.com" autocomplete="email" required>
            </div>
            <div class="form-group">
              <label for="signupPhone">Phone Number</label>
              <i class="fas fa-phone auth-input-icon"></i>
              <input type="tel" id="signupPhone" class="form-control" placeholder="+1 555 123 4567" pattern="[0-9+ -]{7,20}">
            </div>
            <div class="form-group">
              <label for="signupPassword">Password<span>*</span></label>
              <i class="fas fa-lock auth-input-icon"></i>
              <input type="password" id="signupPassword" class="form-control" placeholder="Create a password" autocomplete="new-password" required>
              <button type="button" class="auth-password-toggle" data-target="signupPassword" aria-label="Toggle password visibility">
                <i class="fas fa-eye"></i>
              </button>
              <div class="password-strength-wrap">
                <div class="password-strength-track">
                  <div class="password-strength-bar"></div>
                </div>
                <span class="password-strength-text">Password strength</span>
              </div>
            </div>
            <div class="form-group">
              <label for="signupConfirm">Confirm Password<span>*</span></label>
              <i class="fas fa-lock auth-input-icon"></i>
              <input type="password" id="signupConfirm" class="form-control" placeholder="Confirm your password" autocomplete="new-password" required>
              <button type="button" class="auth-password-toggle" data-target="signupConfirm" aria-label="Toggle password visibility">
                <i class="fas fa-eye"></i>
              </button>
            </div>
            <div class="auth-row" style="margin-bottom: 1.25rem;">
              <label class="auth-checkbox">
                <input type="checkbox" id="termsCheck" required>
                <span>I agree to the <a href="404.html" class="auth-link">Terms of Service</a> & <a href="404.html" class="auth-link">Privacy Policy</a></span>
              </label>
            </div>
            <button type="submit" class="btn auth-btn">
              <i class="fas fa-user-plus"></i> Create Account
            </button>
          </form>
          <div class="auth-divider">or sign up with</div>
          <div class="social-auth-buttons">
            <button type="button" class="social-auth-btn" onclick="window.location.href='404.html'">
              <i class="fab fa-google"></i> Google
            </button>
            <button type="button" class="social-auth-btn" onclick="window.location.href='404.html'">
              <i class="fab fa-facebook-f"></i> Facebook
            </button>
          </div>
        </div>
        <div class="auth-card-footer">
          Already have an account? <a href="signin.html">Sign in here</a>
        </div>
      </div>
    </div>
  </section>

  <script src="js/script.js"></script>
</body>
</html>
